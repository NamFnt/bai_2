<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Nhập Thông Tin</title>
    <style>
        h1
        {
            text-align: center;
            margin: 5px;
            font-size: 32px;
        }
        table
        {
            margin: 0 auto;
            width: 700px;
        }
        table td:first-child
        {
            width: 200px;
        }
        input[type="radio"]
        {
            accent-color: green;
        }
    </style>
</head>
<body>
    <div>
        <div style="background-color: rgb(90, 180, 240); width: 800px; margin: 0 auto;">
            <div style="background-color: cyan; border: 2px solid black; border-radius: 10px; box-shadow: 6px 6px 5px gray; width: 280px; margin: 0 auto; font-family: 'Times New Roman';">
                <h1>Jackson</h1>
                <hr style="border: 2px solid black; margin: 0;">
                <h1>Electronics</h1>
            </div>
            <h1>Registration Form</h1>
            <p style="text-align: center;">Register your Jackson Elsctronics product here</p>
            <form>
                <table>
                    <tr>
                        <td><label for="name1">First Name: </label></td>
                        <td><input id="name1" style="width: 125px;"><label for="name2"> Last Name: </label><input id="name2" style="width: 100px;"></td>
                    </tr>
                    <tr>
                        <td><label for="address1">Address #1: </label></td>
                        <td><input id="address1" style="width: 200px;"></td>
                    </tr>
                    <tr>
                        <td><label for="address2">Address #2: </label></td>
                        <td><input id="address2" style="width: 200px;"></td>
                    </tr>
                    <tr>
                        <td><label for="city">City: </label></td>
                        <td><input id="city"><label for="state">State: </label><input id="state" style="width: 30px;"><label for="zip">Zip: </label><input id="zip" style="width: 50px;"></td>
                    </tr>
                    <tr>
                        <td><label for="country">Country: </label></td>
                        <td><input id="country"></td>
                    </tr>
                </table>
                <hr style="border: 1px solid black; margin-left: 50px; margin-right: 125px;">
                <table>
                    <tr>
                        <td><label for="product">Product: </label></td>
                        <td><select id="product"><option value="1">ScanMaster</option></select></td>
                    </tr>
                    <tr>
                        <td><label for="date">Date Purchased: </label></td>
                        <td><input id="date"></td>
                        
                    </tr>
                    <tr>
                        <td><label for="serial">Serial #: </label></td>
                        <td><input id="serial"></td>
                    </tr>
                    <tr>
                        <td rowspan="3" style="vertical-align: top;"><label>Used for: </label></td>
                        <td><input type="radio" id="home"><label for="home">Home</label></td>
                        <td><input type="radio" id="educational"><label for="educational">Educational Institution</label></td>
                    </tr>
                    <tr>
                        <td><input type="radio" id="business"><label for="business">Business</label></td>
                        <td><input type="radio" id="other"><label for="other">Other</label></td>
                    </tr>
                    <tr>
                        <td><input type="radio" id="govermment"><label for="govermment">Govermment</label></td>
                    </tr>
                    <tr>
                        <td rowspan="2" style="vertical-align: top;"><label>System (check all that apply): </label></td>
                        <td><input id="windows" type="checkbox"><label for="windows">Windows</label></td>
                        <td><input id="unix" type="checkbox"><label for="unix">UNIX</label></td>
                    </tr>
                    <tr>
                        <td><input id="macintosh" type="checkbox"><label for="macintosh">Macintosh</label></td>
                        <td><input id="other1" type="checkbox"><label for="other1">Other</label></td>
                    </tr>
                </table>
                <hr style="border: 1px solid black; margin-left: 50px; margin-right: 125px;">
                <table>
                    <tr>
                        <td style="vertical-align: top;"><label for="comments">Comments?: </label></td>
                        <td>
                            <input id="comments" style="width: 400px; height: 100px;">
                        </td>
                    </tr>
                </table>
                <div style="text-indent: 220px; padding-top: 3px;">
                    <button type="submit">Click to register</button>
                    <button type="reset">Click to cancel</button>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
