<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Nhập Thông Tin</title>
    <style>
        h1
        {
            text-align: center;
            font-size: 32px;
            padding: 0px;
            margin: 0px;
        }
        table
        {
            margin: 0 auto;
            width: 645px;
        }
        table td:first-child
        {
            width: 220px;
        }
        input[type="radio"]
        {
            accent-color: green;
        }
    </style>
</head>
<body>
    <div>
        <div style="background-color: rgb(152, 205, 255); width: 745px; margin: 0 auto;">
            <div style="background-color: cyan; border: 2px solid black; border-radius: 10px; box-shadow: 8px 8px 0px rgb(0, 0, 0, 0.3); width: 320px; margin: 0 auto; font-family: 'Times New Roman';">
                <h1>Jackson</h1>
                <hr style="border: 2px solid black; margin: 0;">
                <h1>Electronics</h1>
            </div>
            <br>
            <h1>Registration Form</h1>
            <p style="text-align: center;">Register your Jackson Elsctronics product here</p>
            <form>
                <table>
                    <tr>
                        <td><label for="name1">First Name: </label></td>
                        <td><input id="name1" style="width: 105px;"><label for="name2"> Last Name: </label><input id="name2" style="width: 100px;"></td>
                    </tr>
                    <tr>
                        <td><label for="address1">Address #1: </label></td>
                        <td><input id="address1" style="width: 200px;"></td>
                    </tr>
                    <tr>
                        <td><label for="address2">Address #2: </label></td>
                        <td><input id="address2" style="width: 200px;"></td>
                    </tr>
                    <tr>
                        <td><label for="city">City: </label></td>
                        <td><input id="city" style="width: 135px"><label for="state">State: </label><input id="state" style="width: 30px;"><label for="zip">Zip: </label><input id="zip" style="width: 65px;"></td>
                    </tr>
                    <tr>
                        <td><label for="country">Country: </label></td>
                        <td><input id="country" value="United States" style="width: 135px"></td>
                    </tr>
                </table>
                <hr style="border: 1px solid black; margin-left: 50px; margin-right: 50px;">
                <table>
                    <tr>
                        <td><label for="product">Product: </label></td>
                        <td><select id="product"><option value="1">ScanMaster</option></select></td>
                    </tr>
                    <tr>
                        <td><label for="date">Date Purchased: </label></td>
                        <td><input id="date" style="width: 135px"></td>
                        
                    </tr>
                    <tr>
                        <td><label for="serial">Serial #: </label></td>
                        <td><input id="serial" style="width: 135px"></td>
                    </tr>
                    <tr>
                        <td style="vertical-align: top;><label>Used for: </label></td>
                        <td colspan="2">
                            <div>
                                <label><input type="radio" name="used_for" value="Home"> Home</label>
                                <label><input type="radio" name="used_for" value="Educational"> Educational Institution</label>
                                <label><input type="radio" name="used_for" value="Business"> Business</label>
                                <label><input type="radio" name="used_for" value="Other"> Other</label>
                                <label><input type="radio" name="used_for" value="Government"> Government</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="vertical-align: top; padding-top: 10px;"><label>System (check all that apply): </label></td>
                        <td colspan="2" style="padding-top: 10px;">
                            <div style="display: grid; grid-template-columns: 150px auto; row-gap: 2px;">
                                <label><input name="system" type="checkbox" value="Windows"> Windows</label>
                                <label><input name="system" type="checkbox" value="UNIX"> UNIX</label>
                                <label><input name="system" type="checkbox" value="Macintosh"> Macintosh</label>
                                <label><input name="system" type="checkbox" value="Other"> Other</label>
                            </div>
                        </td>
                    </tr>
                </table>
                <hr style="border: 1px solid black; margin-left: 50px; margin-right: 50px;">
                <table>
                    <tr>
                        <td style="vertical-align: top;"><label for="comments">Comments?: </label></td>
                        <td>
                            <input id="comments" style="width: 400px; height: 100px;">
                        </td>
                    </tr>
                </table>
                <div style="text-indent: 245px; padding-top: 3px;">
                    <button type="submit">Click to register</button>
                    <button type="reset">Click to cancel</button>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
